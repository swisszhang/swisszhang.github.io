<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% seo title=false %}
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">Zhijian <span class="alias">(James)</span> Zhang</a></h1>
        <p class="headline">{{ site.description }}</p>
        {% include contact.html %}
      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p class="colophon">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
